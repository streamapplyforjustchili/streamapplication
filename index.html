
<!DOCTYPE html>
<html>
<head>
    <title>Stream Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Stream Application</h1>
        <p>Apply to be part of the stream!</p>

        <form id="applicationForm">
            <label>Discord Username</label>
            <input type="text" id="discord" placeholder="Your Discord username" required>

            <label>Why do you want to be part of the stream?</label>
            <textarea id="reason" placeholder="Tell us why..." required></textarea>

            <button type="submit">Submit Application</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
